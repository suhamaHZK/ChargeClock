<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" role="img" aria-label="ダブルタップ後の設定解除スライダー">
  <defs>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <filter id="thumbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="8" y="14" width="344" height="44" rx="22" fill="url(#trackGrad)" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="41" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#888">スライドで設定</text>
  <g fill="#555" opacity="0.95">
    <path d="M248 36 l8-8 2 2-6 6 6 6-2 2z" opacity="0.35"/>
    <path d="M262 36 l8-8 2 2-6 6 6 6-2 2z" opacity="0.65"/>
    <path d="M276 36 l8-8 2 2-6 6 6 6-2 2z"/>
  </g>
  <text x="298" y="41" font-family="system-ui,sans-serif" font-size="13" fill="#666">&gt;&gt;</text>
  <g filter="url(#thumbShadow)">
    <rect x="12" y="18" width="56" height="36" rx="18" fill="#ffffff"/>
    <path d="M28 36 h18 M38 28 l10 8-10 8" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
